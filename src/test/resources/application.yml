spring:
  datasource:
    url: jdbc:h2:mem:araw;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  mail:
    host:
    port: 0
    username:
    password:

app:
  notifications:
    publication:
      enabled: false
  media:
    minio:
      endpoint: http://localhost:9000
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key
      secure: false
      presigned-expiry-minutes: 60
